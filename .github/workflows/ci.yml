name: SmartTools CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend & Shared Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install shared dependencies
        run: |
          if [ -f shared/package.json ]; then
            npm --prefix shared ci
          fi

      - name: Install backend dependencies
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm --prefix backend ci

      - name: Run shared package tests
        run: |
          if [ -f shared/package.json ]; then
            npm --prefix shared test --if-present
          fi

      - name: Run backend unit & integration tests
        env:
          NODE_ENV: test
          USE_IN_MEMORY_DB: 'true'
          JWT_ACCESS_SECRET: ci-test-jwt-access-secret-minimum-32-chars-2026
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-minimum-32-chars-2026
          CLIENT_URL: http://localhost:5173
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
        run: npm --prefix backend test

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install shared dependencies
        run: |
          if [ -f shared/package.json ]; then
            npm --prefix shared ci
          fi

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend lint (if configured)
        run: npm --prefix frontend run lint --if-present

      - name: Build frontend SPA
        env:
          VITE_API_BASE_URL: https://smarttools-api.onrender.com/api/v1
        run: npm --prefix frontend run build
